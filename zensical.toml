[project]
nav = [
  { "首页" = "index.md" },
  { "编程语言" = [
    {"编程语言"="language/README.md"},
    { "Python" = "language/python/README.md" },
    { "Golang" = "language/golang/README.md" },
    { "Rust" = "language/rust/README.md" },
    # { "C" = "language/c/README.md" },
    # { "PHP" = "language/php/README.md" },
  ] },
  { "数据库" = [
    {"数据库"="database/README.md"},
    { "MySQL" = "database/mysql/README.md" },
    { "Redis" = "database/redis/README.md" },
  ] },
  { "中间件" = [
    {"中间件"="middleware/README.md"},
    { "Kafka" = "middleware/kafka/README.md" },
    { "RabbitMQ" = "middleware/rabbitmq/README.md" },
  ] },
  { "分布式系统" = [
    {"分布式系统"="distributed/README.md"},
  ] },
  { "服务治理" = [
    {"服务治理"="governance/README.md"},
    { "稳定性" = "governance/stability/README.md" },
    { "可观测性" = "governance/observability/README.md" },
  ] },
  { "AI" = [
    {"AI"="ai/README.md"},
  ]},
]
site_name = "Tech Notes"
site_description = "Backend engineering notes by Palemoky"
site_author = "Palemoky"
site_url = "https://tech.palemoky.com"
repo_url = "https://github.com/palemoky/tech"
repo_name = "palemoky"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; <span id='copyright-year'>2026</span> Palemoky"
extra_javascript = [
  "assets/javascripts/mathjax.js",
  "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js",
  "assets/javascripts/width-toggle.js",
]
extra_css = ["assets/stylesheets/extra.css"]

[project.theme]
variant = "modern"
language = "zh"
primary = "white"
accent = "blue"
custom_dir = "overrides"
favicon = "assets/logo.webp"
logo = "assets/logo.webp"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "content.footnote.tooltips",
  "navigation.expand",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

icon = { repo = "fontawesome/brands/github", edit = "lucide/file-edit" }
palette = [
  { scheme = "default", toggle.icon = "lucide/sun", toggle.name = "Switch to dark mode" },
  { scheme = "slate", toggle.icon = "lucide/moon", toggle.name = "Switch to light mode" },
]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
tables = {}
admonition = {}
footnotes = {}
abbr = {}
def_list = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

[project.markdown_extensions.zensical.extensions.glightbox]

[project.markdown_extensions.pymdownx]
arithmatex = { generic = true }
betterem = { smart_enable = "none" }
caret = {}
details = {}
emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
highlight.pygments_lang_class = true
inlinehilite = {}
keys = {}
mark = {}
smartsymbols = {}
superfences = {}
tabbed = { alternate_style = true }
tasklist = { custom_checkbox = true }
tilde = {}
magiclink = {}
blocks.caption = {}

[project.extra]
generator = false
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/palemoky" },
  { icon = "fontawesome/solid/code", link = "https://algo.palemoky.com" },
  { icon = "fontawesome/solid/feather", link = "https://poetry.palemoky.com" },
  { icon = "fontawesome/solid/feather-pointed", link = "https://blog.palemoky.com" },
]
